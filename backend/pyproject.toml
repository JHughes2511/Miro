[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MiroFish Backend"
requires-python = ">=3.11,<=3.12"
dependencies = [
    "flask>=3.1.1",
    "flask-cors>=5.0.1",
    "openai>=1.82.1",
    "python-dotenv>=1.1.0",
    "zep-cloud>=2.12.0",
    "oasis-sim>=0.1.1",
    "pandas>=2.2.3",
    "markitdown[all]>=0.1.2",
    "json-repair>=0.44.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
